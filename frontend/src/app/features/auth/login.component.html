<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <h2>Employee Leave Portal</h2>
      <p>Sign in to manage leave balances, requests, and approvals.</p>
    </div>

    <!-- Error Alert Box -->
    <div *ngIf="errorMessage()" class="alert-error">
      {{ errorMessage() }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Work Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="name@company.com"
          [class.invalid]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
        />
        <span
          class="field-error"
          *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('required')"
        >
          Email address is required.
        </span>
        <span
          class="field-error"
          *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('email')"
        >
          Enter a valid email address.
        </span>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••••••"
          [class.invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
        />
        <span
          class="field-error"
          *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')"
        >
          Password is required.
        </span>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-submit" [disabled]="isSubmitting()">
        <span *ngIf="!isSubmitting()">Sign In</span>
        <span *ngIf="isSubmitting()">Signing in...</span>
      </button>

      <!-- Demo Account Quick Helpers -->
      <div class="demo-helpers">
        <p>Quick Demo Credentials:</p>
        <div class="helper-buttons">
          <button type="button" class="btn-demo" (click)="fillDemoEmployee()">Employee</button>
          <button type="button" class="btn-demo" (click)="fillDemoManager()">Manager</button>
        </div>
      </div>
    </form>
  </div>
</div>
