<div class="apply-leave-container">
  <div class="form-card">
    <div class="card-header">
      <h2>Apply for Leave</h2>
      <p>Submit a new leave booking for managerial review.</p>
    </div>

    <!-- Error Alert Box -->
    <div *ngIf="errorMessage()" class="alert-error">
      {{ errorMessage() }}
    </div>

    <!-- Active Balance Quick Ribbon -->
    <div class="balance-ribbon" *ngIf="balances().length > 0">
      <div *ngFor="let b of balances()" class="ribbon-item">
        <span class="ribbon-type">{{ b.leaveType }}:</span>
        <span class="ribbon-days">{{ b.remainingDays }} left</span>
      </div>
    </div>

    <form [formGroup]="leaveForm" (ngSubmit)="onSubmit()" class="leave-form">
      <!-- Leave Category Select -->
      <div class="form-group">
        <label for="leaveType">Leave Type</label>
        <select id="leaveType" formControlName="leaveType">
          <option *ngFor="let t of leaveTypes" [value]="t.value">{{ t.label }}</option>
        </select>
      </div>

      <!-- Date Range Inputs -->
      <div class="form-row">
        <div class="form-group">
          <label for="startDate">Start Date</label>
          <input id="startDate" type="date" formControlName="startDate" />
          <span
            class="field-error"
            *ngIf="leaveForm.get('startDate')?.touched && leaveForm.get('startDate')?.hasError('required')"
          >
            Start date is required.
          </span>
        </div>

        <div class="form-group">
          <label for="endDate">End Date</label>
          <input id="endDate" type="date" formControlName="endDate" />
          <span
            class="field-error"
            *ngIf="leaveForm.get('endDate')?.touched && leaveForm.get('endDate')?.hasError('required')"
          >
            End date is required.
          </span>
        </div>
      </div>

      <div class="field-error" *ngIf="leaveForm.errors?.['dateRangeInvalid'] && leaveForm.touched">
        End date cannot be earlier than start date.
      </div>

      <!-- Reason Textarea -->
      <div class="form-group">
        <label for="reason">Reason / Justification</label>
        <textarea
          id="reason"
          rows="4"
          formControlName="reason"
          placeholder="Briefly state the reason for your time off..."
          [class.invalid]="leaveForm.get('reason')?.touched && leaveForm.get('reason')?.invalid"
        ></textarea>
        <span
          class="field-error"
          *ngIf="leaveForm.get('reason')?.touched && leaveForm.get('reason')?.hasError('required')"
        >
          A justification is required.
        </span>
      </div>

      <!-- Actions -->
      <div class="form-actions">
        <button type="button" class="btn-cancel" routerLink="/dashboard">Cancel</button>
        <button type="submit" class="btn-submit" [disabled]="isSubmitting()">
          <span *ngIf="!isSubmitting()">Submit Application</span>
          <span *ngIf="isSubmitting()">Submitting...</span>
        </button>
      </div>
    </form>
  </div>
</div>
